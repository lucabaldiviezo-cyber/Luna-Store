<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda</title>
  
  <!-- SDK v2 de Mercado Pago -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Navbar y Botón de Carrito */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #1e1e1e;
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .cart-icon-btn {
      position: relative;
      background: transparent;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: #e74c3c;
      color: white;
      font-size: 12px;
      font-weight: bold;
      border-radius: 50%;
      padding: 2px 6px;
      min-width: 18px;
      text-align: center;
      display: none; /* Se muestra con JS al sumar productos */
    }

    /* Catálogo de Productos (Mobile First) */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-card {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .btn-add {
      background: #009ee3;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      width: 100%;
      margin-top: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Overlay y Carrito Lateral (Mobile Friendly) */
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 200;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 420px;
      height: 100%;
      background: white;
      z-index: 300;
      transition: right 0.3s ease-in-out;
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-header {
      padding: 20px;
      background: #f8f9fa;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .cart-close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }

    .cart-body {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    .cart-footer {
      padding: 20px;
      border-top: 1px solid #eee;
      background: #fff;
    }

    /* Opciones de Checkout */
    .payment-options {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .payment-option-btn {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f8f9fa;
      cursor: pointer;
      text-align: left;
      font-weight: bold;
    }

    .payment-option-btn.active {
      border-color: #009ee3;
      background: #e6f7ff;
    }

    #cardPaymentBrick_container {
      margin-top: 15px;
    }

    .btn-checkout {
      width: 100%;
      padding: 14px;
      background: #009ee3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <h2>Mi Tienda</h2>
    <button class="cart-icon-btn" onclick="toggleCart()">
      🛒 <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </header>

  <!-- Productos -->
  <main class="products-grid">
    <div class="product-card">
      <h3>Producto Ejemplo 1</h3>
      <p>$5.000</p>
      <button class="btn-add" onclick="addToCart(1, 'Producto Ejemplo 1', 5000)">Agregar al carrito</button>
    </div>
    <div class="product-card">
      <h3>Producto Ejemplo 2</h3>
      <p>$10.000</p>
      <button class="btn-add" onclick="addToCart(2, 'Producto Ejemplo 2', 10000)">Agregar al carrito</button>
    </div>
  </main>

  <!-- Fondo oscuro cuando se abre el carrito -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>

  <!-- Carrito Desplegable (Drawer) -->
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Tu Carrito</h3>
      <button class="cart-close-btn" onclick="toggleCart()">&times;</button>
    </div>

    <div class="cart-body" id="cartItems">
      <p>El carrito está vacío.</p>
    </div>

    <div class="cart-footer">
      <h4>Total: $<span id="cartTotal">0</span></h4>

      <!-- Métodos de pago -->
      <div class="payment-options">
        <label class="payment-option-btn active" id="opt-mp">
          <input type="radio" name="payment_method" value="mp" checked onchange="switchPaymentMethod('mp')"> Mercado Pago (Redirección / Cuenta)
        </label>
        <label class="payment-option-btn" id="opt-card">
          <input type="radio" name="payment_method" value="card" onchange="switchPaymentMethod('card')"> Tarjeta de Crédito / Débito
        </label>
      </div>

      <!-- Contenedores según el método -->
      <div id="mpSection">
        <button class="btn-checkout" onclick="checkoutMP()">Pagar con Mercado Pago</button>
      </div>

      <div id="cardSection" style="display: none;">
        <div id="cardPaymentBrick_container"></div>
      </div>
    </div>
  </aside>

  <script>
    // Configuración Inicial Mercado Pago
    const mp = new MercadoPago('TU_PUBLIC_KEY', { locale: 'es-AR' });
    let cart = [];
    let cardBrickController = null;

    // Abrir / Cerrar Carrito
    function toggleCart() {
      const drawer = id('cartDrawer');
      const overlay = id('cartOverlay');
      drawer.classList.toggle('open');
      overlay.style.display = drawer.classList.contains('open') ? 'block' : 'none';
    }

    // Agregar Producto
    function addToCart(id, name, price) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ id, name, price, quantity: 1 });
      }
      updateCartUI();
      toggleCart(); // Abre el carrito al agregar
    }

    // Actualizar UI del Carrito y Badge
    function updateCartUI() {
      const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
      const badge = id('cartBadge');
      
      if (totalItems > 0) {
        badge.innerText = totalItems;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }

      const cartContainer = id('cartItems');
      if (cart.length === 0) {
        cartContainer.innerHTML = '<p>El carrito está vacío.</p>';
        id('cartTotal').innerText = '0';
        return;
      }

      let html = '';
      let total = 0;

      cart.forEach(item => {
        const subtotal = item.price * item.quantity;
        total += subtotal;
        html += `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              <small>${item.quantity}x $${item.price}</small>
            </div>
            <span>$${subtotal}</span>
          </div>
        `;
      });

      cartContainer.innerHTML = html;
      id('cartTotal').innerText = total;

      // Si el Brick de tarjeta ya estaba activo, actualizar monto
      if (cardBrickController) {
        cardBrickController.unmount();
        cardBrickController = null;
        if (id('cardSection').style.display === 'block') {
          renderCardBrick();
        }
      }
    }

    // Cambiar vista entre MP y Tarjeta
    function switchPaymentMethod(method) {
      if (method === 'mp') {
        id('mpSection').style.display = 'block';
        id('cardSection').style.display = 'none';
        id('opt-mp').classList.add('active');
        id('opt-card').classList.remove('active');
      } else {
        id('mpSection').style.display = 'none';
        id('cardSection').style.display = 'block';
        id('opt-card').classList.add('active');
        id('opt-mp').classList.remove('active');
        renderCardBrick();
      }
    }

    // Checkout 1: Mercado Pago Wallet / Preferencia
    async function checkoutMP() {
      if (cart.length === 0) return alert('El carrito está vacío');
      
      const res = await fetch('/create-preference', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: cart })
      });
      const data = await res.json();
      if (data.init_point) {
        window.location.href = data.init_point;
      }
    }

    // Checkout 2: Tarjeta Directa via Card Brick
    async function renderCardBrick() {
      if (cardBrickController || cart.length === 0) return;

      const totalAmount = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      const bricksBuilder = mp.bricks();

      cardBrickController = await bricksBuilder.create('cardPayment', 'cardPaymentBrick_container', {
        initialization: {
          amount: totalAmount,
        },
        customization: {
          paymentMethods: { maxInstallments: 12 },
          visual: { style: { theme: 'default' } }
        },
        callbacks: {
          onReady: () => {},
          onSubmit: (cardFormData) => {
            return new Promise((resolve, reject) => {
              fetch('/process-card-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cardFormData),
              })
              .then(res => res.json())
              .then(data => {
                if (data.status === 'approved') {
                  alert('¡Pago Aprobado!');
                  cart = [];
                  updateCartUI();
                  toggleCart();
                } else {
                  alert('Pago rechazado: ' + data.status_detail);
                }
                resolve();
              })
              .catch(err => {
                console.error(err);
                reject();
              });
            });
          },
          onError: (err) => console.error(err),
        },
      });
    }

    function id(str) { return document.getElementById(str); }
  </script>
</body>
</html>
