<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Luna | Productos Virales y Tendencias</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .hero-section {
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
    }
    .card-img-top {
      height: 220px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">🌙 TIENDA LUNA</a>
      <button class="btn btn-outline-light position-relative" type="button" data-bs-toggle="modal" data-bs-target="#modalCarrito">
        🛒 Carrito
        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
      </button>
    </div>
  </nav>

  <!-- Banner / Hero -->
  <header class="hero-section text-center py-5 text-white">
    <div class="container my-4">
      <h1 class="display-4 fw-bold">🔥 Productos Virales & Tendencias</h1>
      <p class="lead">Lo más buscado e innovador de internet a un clic de distancia.</p>
      <a href="#catalogo" class="btn btn-primary btn-lg mt-2 fw-semibold">Explorar Catálogo</a>
    </div>
  </header>

  <!-- Filtros por Categoría -->
  <section class="container my-4 text-center">
    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <button class="btn btn-outline-dark active" onclick="filtrarCategoria('todos')">🌐 Todos</button>
      <button class="btn btn-outline-dark" onclick="filtrarCategoria('gadgets')">⚡ Gadgets & Tecno</button>
      <button class="btn btn-outline-dark" onclick="filtrarCategoria('hogar')">🏠 Hogar & Deco</button>
      <button class="btn btn-outline-dark" onclick="filtrarCategoria('tendencia')">🔥 Más Vendidos</button>
    </div>
  </section>

  <!-- Catálogo de Productos -->
  <main id="catalogo" class="container my-5">
    <div class="row g-4" id="contenedor-productos">
      <!-- Los productos se cargarán dinámicamente desde JS -->
    </div>
  </main>

  <!-- Modal del Carrito -->
  <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">🛒 Tu Carrito de Compras</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <ul id="lista-carrito" class="list-group mb-3">
            <li class="list-group-item text-center text-muted">El carrito está vacío</li>
          </ul>
          <div class="d-flex justify-content-between fw-bold fs-5">
            <span>Total:</span>
            <span id="total-carrito">$0</span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button id="btn-finish-order" type="button" class="btn btn-success fw-bold w-100 mt-2">Finalizar Compra</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Script Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Lógica JavaScript -->
  <script>
    // 1. Catálogo actualizado de productos virales
    const productos = [
      {
        id: 1,
        nombre: "Mini Impresora Térmica Bluetooth",
        precio: 25000,
        categoria: "gadgets",
        imagen: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop"
      },
      {
        id: 2,
        nombre: "Humidificador LED Efecto Volcán",
        precio: 18500,
        categoria: "hogar",
        imagen: "https://images.unsplash.com/photo-1545259741-2ea3ebf61fa3?w=500&auto=format&fit=crop"
      },
      {
        id: 3,
        nombre: "Lámpara Cuerpos Celestes Flotante",
        precio: 32000,
        categoria: "tendencia",
        imagen: "https://images.unsplash.com/photo-1507499739999-097706ad8914?w=500&auto=format&fit=crop"
      },
      {
        id: 4,
        nombre: "Aspiradora de Mano Inalámbrica Pro",
        precio: 21500,
        categoria: "hogar",
        imagen: "https://images.unsplash.com/photo-1558317374-067fb5f30001?w=500&auto=format&fit=crop"
      }
    ];

    let carrito = [];

    // 2. Renderizar productos en pantalla
    function cargarProductos(lista = productos) {
      const contenedor = document.getElementById("contenedor-productos");
      if (!contenedor) return;

      contenedor.innerHTML = "";

      lista.forEach(p => {
        const col = document.createElement("div");
        col.className = "col-md-4 col-sm-6";
        col.innerHTML = `
          <div class="card h-100 shadow-sm border-0">
            <img src="${p.imagen}" class="card-img-top" alt="${p.nombre}">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title fw-bold">${p.nombre}</h5>
              <p class="card-text text-primary fw-bold fs-5 mb-3">$${p.precio.toLocaleString('es-AR')}</p>
              <button onclick="agregarAlCarrito(${p.id})" class="btn btn-dark mt-auto w-100 fw-semibold">
                🛒 Agregar al Carrito
              </button>
            </div>
          </div>
        `;
        contenedor.appendChild(col);
      });
    }

    // 3. Filtrar categorías
    function filtrarCategoria(cat) {
      if (cat === 'todos') {
        cargarProductos(productos);
      } else {
        const filtrados = productos.filter(p => p.categoria === cat);
        cargarProductos(filtrados);
      }
    }

    // 4. Agregar al carrito
    function agregarAlCarrito(id) {
      const prod = productos.find(p => p.id === id);
      if (prod) {
        carrito.push(prod);
        actualizarCarritoUI();
      }
    }

    // 5. Actualizar interfaz del carrito
    function actualizarCarritoUI() {
      const lista = document.getElementById("lista-carrito");
      const totalSpan = document.getElementById("total-carrito");
      const badgeCount = document.getElementById("cart-count");

      badgeCount.innerText = carrito.length;

      if (carrito.length === 0) {
        lista.innerHTML = '<li class="list-group-item text-center text-muted">El carrito está vacío</li>';
        totalSpan.innerText = "$0";
        return;
      }

      lista.innerHTML = "";
      let total = 0;

      carrito.forEach((p, index) => {
        total += p.precio;
        const item = document.createElement("li");
        item.className = "list-group-item d-flex justify-content-between align-items-center";
        item.innerHTML = `
          <span>${p.nombre}</span>
          <span class="fw-bold">$${p.precio.toLocaleString('es-AR')}</span>
        `;
        lista.appendChild(item);
      });

      totalSpan.innerText = `$${total.toLocaleString('es-AR')}`;
    }

    // 6. Conexión con Mercado Pago (Backend en Render)
    document.addEventListener("DOMContentLoaded", () => {
      cargarProductos();

      const btnFinish = document.getElementById("btn-finish-order");
      if (btnFinish) {
        btnFinish.addEventListener("click", async () => {
          if (carrito.length === 0) {
            alert("El carrito está vacío.");
            return;
          }

          const textoOriginal = btnFinish.innerText;

          try {
            btnFinish.innerText = "Cargando...";
            btnFinish.disabled = true;

            const respuesta = await fetch('https://luna-store-3ubu.onrender.com/api/crear-preferencia', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                items: carrito
              })
            });

            const data = await respuesta.json();

            if (data.init_point) {
              window.location.href = data.init_point;
            } else {
              alert("No se pudo iniciar el proceso de pago.");
            }

          } catch (error) {
            console.error("Error al procesar la compra:", error);
            alert("Hubo un error al conectar con el servidor.");
          } finally {
            btnFinish.innerText = textoOriginal;
            btnFinish.disabled = false;
          }
        });
      }
    });
  </script>
</body>
</html>
