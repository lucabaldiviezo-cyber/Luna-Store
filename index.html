<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA STORE | Tendencias & Virales</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Estilos minimalistas y limpios */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #111;
    }

    .navbar-brand {
      letter-spacing: 1.5px;
    }

    .hero-banner {
      background-color: #ffffff;
      border-bottom: 1px solid #eaeaea;
      padding: 60px 20px;
    }

    .btn-category {
      border: 1px solid #e5e7eb;
      background: #ffffff;
      color: #374151;
      border-radius: 20px;
      padding: 6px 18px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-category:hover, .btn-category.active {
      background: #111827;
      color: #ffffff;
      border-color: #111827;
    }

    .card-product {
      border: none;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-product:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .card-img-container {
      height: 240px;
      overflow: hidden;
      background-color: #f3f4f6;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-add-cart {
      background-color: #111827;
      color: #ffffff;
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      padding: 10px;
      transition: background 0.2s;
    }

    .btn-add-cart:hover {
      background-color: #1f2937;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Navegación Superior -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand fw-bold text-dark fs-4" href="#">LUNA STORE</a>
      
      <button class="btn btn-outline-dark position-relative rounded-pill px-3" type="button" data-bs-toggle="modal" data-bs-target="#modalCarrito">
        🛒 Carrito
        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark">0</span>
      </button>
    </div>
  </nav>

  <!-- Banner Limpio -->
  <header class="hero-banner text-center">
    <div class="container max-w-md">
      <h1 class="fw-bold display-6 mb-2">Productos Virales & Tendencias</h1>
      <p class="text-muted mb-0">Lo más buscado de internet seleccionado en un solo lugar.</p>
    </div>
  </header>

  <!-- Categorías / Filtros -->
  <section class="container my-4">
    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <button class="btn-category active" onclick="filtrarCategoria('todos')">Todos</button>
      <button class="btn-category" onclick="filtrarCategoria('gadgets')">Gadgets</button>
      <button class="btn-category" onclick="filtrarCategoria('hogar')">Hogar & Deco</button>
      <button class="btn-category" onclick="filtrarCategoria('tendencia')">Más Vendidos</button>
    </div>
  </section>

  <!-- Catálogo de Productos -->
  <main class="container my-4">
    <div class="row g-4" id="contenedor-productos">
      <!-- Carga dinámica de productos -->
    </div>
  </main>

  <!-- Modal del Carrito -->
  <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Tu Carrito</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <ul id="lista-carrito" class="list-group list-group-flush mb-3">
            <li class="list-group-item text-center text-muted border-0 py-4">El carrito está vacío</li>
          </ul>
          <div class="d-flex justify-content-between fw-bold fs-5 pt-3 border-top">
            <span>Total:</span>
            <span id="total-carrito">$0</span>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button id="btn-finish-order" type="button" class="btn btn-dark fw-semibold w-100 py-2">Finalizar Compra</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // 1. Arreglo de Productos Virales
    const productos = [
      {
        id: 1,
        nombre: "Mini Impresora Térmica Bluetooth",
        precio: 25000,
        categoria: "gadgets",
        imagen: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop"
      },
      {
        id: 2,
        nombre: "Humidificador LED Efecto Volcán",
        precio: 18500,
        categoria: "hogar",
        imagen: "https://images.unsplash.com/photo-1545259741-2ea3ebf61fa3?w=500&auto=format&fit=crop"
      },
      {
        id: 3,
        nombre: "Lámpara Cuerpos Celestes Flotante",
        precio: 32000,
        categoria: "tendencia",
        imagen: "https://images.unsplash.com/photo-1507499739999-097706ad8914?w=500&auto=format&fit=crop"
      },
      {
        id: 4,
        nombre: "Aspiradora de Mano Inalámbrica Pro",
        precio: 21500,
        categoria: "hogar",
        imagen: "https://images.unsplash.com/photo-1558317374-067fb5f30001?w=500&auto=format&fit=crop"
      }
    ];

    let carrito = [];

    // 2. Renderizar catálogo
    function cargarProductos(lista = productos) {
      const contenedor = document.getElementById("contenedor-productos");
      if (!contenedor) return;

      contenedor.innerHTML = "";

      lista.forEach(p => {
        const col = document.createElement("div");
        col.className = "col-md-4 col-sm-6";
        col.innerHTML = `
          <div class="card card-product h-100">
            <div class="card-img-container">
              <img src="${p.imagen}" alt="${p.nombre}">
            </div>
            <div class="card-body d-flex flex-column p-3">
              <h6 class="card-title fw-bold text-dark mb-1">${p.nombre}</h6>
              <p class="text-muted small mb-3">$${p.precio.toLocaleString('es-AR')}</p>
              <button onclick="agregarAlCarrito(${p.id})" class="btn btn-add-cart mt-auto w-100 border-0">
                Agregar al carrito
              </button>
            </div>
          </div>
        `;
        contenedor.appendChild(col);
      });
    }

    // 3. Filtrar por categoría
    function filtrarCategoria(cat) {
      const botones = document.querySelectorAll('.btn-category');
      botones.forEach(btn => {
        if (btn.innerText.toLowerCase().includes(cat) || (cat === 'todos' && btn.innerText === 'Todos')) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      if (cat === 'todos') {
        cargarProductos(productos);
      } else {
        const filtrados = productos.filter(p => p.categoria === cat);
        cargarProductos(filtrados);
      }
    }

    // 4. Lógica del Carrito
    function agregarAlCarrito(id) {
      const prod = productos.find(p => p.id === id);
      if (prod) {
        carrito.push(prod);
        actualizarCarritoUI();
      }
    }

    function actualizarCarritoUI() {
      const lista = document.getElementById("lista-carrito");
      const totalSpan = document.getElementById("total-carrito");
      const badgeCount = document.getElementById("cart-count");

      badgeCount.innerText = carrito.length;

      if (carrito.length === 0) {
        lista.innerHTML = '<li class="list-group-item text-center text-muted border-0 py-4">El carrito está vacío</li>';
        totalSpan.innerText = "$0";
        return;
      }

      lista.innerHTML = "";
      let total = 0;

      carrito.forEach((p) => {
        total += p.precio;
        const item = document.createElement("li");
        item.className = "list-group-item d-flex justify-content-between align-items-center border-bottom px-0 py-2";
        item.innerHTML = `
          <span class="small fw-semibold">${p.nombre}</span>
          <span class="small text-muted">$${p.precio.toLocaleString('es-AR')}</span>
        `;
        lista.appendChild(item);
      });

      totalSpan.innerText = `$${total.toLocaleString('es-AR')}`;
    }

    // 5. Checkout con Mercado Pago (Backend en Render)
    document.addEventListener("DOMContentLoaded", () => {
      cargarProductos();

      const btnFinish = document.getElementById("btn-finish-order");
      if (btnFinish) {
        btnFinish.addEventListener("click", async () => {
          if (carrito.length === 0) {
            alert("El carrito está vacío.");
            return;
          }

          const textoOriginal = btnFinish.innerText;

          try {
            btnFinish.innerText = "Procesando...";
            btnFinish.disabled = true;

            const respuesta = await fetch('https://luna-store-3ubu.onrender.com/api/crear-preferencia', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ items: carrito })
            });

            const data = await respuesta.json();

            if (data.init_point) {
              window.location.href = data.init_point;
            } else {
              alert("No se pudo iniciar el pago.");
            }

          } catch (error) {
            console.error("Error al procesar la compra:", error);
            alert("Error de conexión con el servidor.");
          } finally {
            btnFinish.innerText = textoOriginal;
            btnFinish.disabled = false;
          }
        });
      }
    });
  </script>
</body>
</html>
